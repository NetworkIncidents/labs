# Ping works, websites don't: a Network Incidents lab. Start it with ./lab.sh up (see README.md).
name: dns-down
topology:
  nodes:
    client:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip addr add 10.0.10.10/24 dev eth1
        - ip route replace default via 10.0.10.1 dev eth1
        # the homelab's DNS server, as DHCP would hand it out
        - sh -c 'printf "nameserver 10.0.20.53\nsearch homelab.test\n" > /etc/resolv.conf'
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1   # tested 2026-10-19
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - configs/r1/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        # keep the lab off the real network: no default route out of containerlab's management port
        - ip route del default
    # the DNS "box": owns the address; the DNS service runs in the coredns node, which shares its network
    dns:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip addr add 10.0.20.53/24 dev eth1
        - ip route replace default via 10.0.20.1 dev eth1
    coredns:
      kind: linux
      image: coredns/coredns:1.14.7   # no shell, so it can't configure its own interface
      network-mode: container:dns
      binds:
        - configs/coredns/Corefile:/Corefile
      cmd: -conf /Corefile
    # the homelab switch: dns and web share the services subnet behind r1
    sw:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set br0 up
        # no route out to the real LAN from the switch either
        - ip link set eth0 down
    web:
      kind: linux
      image: nicolaka/netshoot:v0.16
      binds:
        - configs/web/index.html:/srv/index.html
      exec:
        - ip addr add 10.0.20.80/24 dev eth1
        - ip route replace default via 10.0.20.1 dev eth1
        - sh -c 'cd /srv && nohup python3 -m http.server 80 >/dev/null 2>&1 &'
  # containerlab defaults veths to 9500
  links:
    - endpoints: ["client:eth1", "r1:eth1"]
      mtu: 1500
    - endpoints: ["r1:eth2", "sw:eth1"]
      mtu: 1500
    - endpoints: ["sw:eth2", "dns:eth1"]
      mtu: 1500
    - endpoints: ["sw:eth3", "web:eth1"]
      mtu: 1500
