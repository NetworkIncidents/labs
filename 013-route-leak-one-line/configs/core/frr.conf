frr defaults traditional
hostname core
!
interface lo
 ip address 192.0.2.129/25
!
interface eth1
 description to edge
 ip address 10.0.2.2/30
!
interface eth2
 description to peer
 ip address 10.0.3.1/30
!
ip prefix-list OURS seq 5 permit 192.0.2.0/24 le 25
!
bgp community-list standard FROM-PEER seq 5 permit 64500:3
!
route-map FROM-PEER permit 10
 set community 64500:3 additive
exit
!
route-map TO-PEER permit 10
 match ip address prefix-list OURS
exit
!
router bgp 64500
 bgp router-id 192.0.2.129
 neighbor 10.0.2.1 remote-as 64500
 neighbor 10.0.2.1 description edge
 neighbor 10.0.2.1 timers 3 9
 neighbor 10.0.3.2 remote-as 64501
 neighbor 10.0.3.2 description peer
 neighbor 10.0.3.2 timers 3 9
 !
 address-family ipv4 unicast
  network 192.0.2.128/25
  neighbor 10.0.2.1 next-hop-self
  neighbor 10.0.3.2 route-map FROM-PEER in
  neighbor 10.0.3.2 route-map TO-PEER out
 exit-address-family
exit
!
