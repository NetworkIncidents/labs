frr defaults traditional
hostname transit
!
interface eth1
 description to user
 ip address 203.0.113.1/24
!
interface eth2
 description to edge (customer, AS64500)
 ip address 10.0.1.1/30
!
interface eth3
 description to peer (peer, AS64501)
 ip address 10.0.4.1/30
!
route-map CUSTOMER-IN permit 10
 set local-preference 200
exit
!
route-map PEER-IN permit 10
 set local-preference 100
exit
!
route-map ALL permit 10
exit
!
router bgp 64502
 bgp router-id 203.0.113.1
 neighbor 10.0.1.2 remote-as 64500
 neighbor 10.0.1.2 description customer
 neighbor 10.0.1.2 timers 3 9
 neighbor 10.0.4.2 remote-as 64501
 neighbor 10.0.4.2 description peer
 neighbor 10.0.4.2 timers 3 9
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.0.1.2 route-map CUSTOMER-IN in
  neighbor 10.0.1.2 route-map ALL out
  neighbor 10.0.4.2 route-map PEER-IN in
  neighbor 10.0.4.2 route-map ALL out
 exit-address-family
exit
!
