frr defaults traditional
hostname peer
!
interface lo
 ip address 198.51.100.10/24
!
interface eth1
 description to transit
 ip address 10.0.4.2/30
!
interface eth2
 description to core
 ip address 10.0.3.2/30
!
ip prefix-list OWN seq 5 permit 198.51.100.0/24
!
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
exit
!
route-map ACCEPT permit 10
exit
!
router bgp 64501
 bgp router-id 198.51.100.10
 neighbor 10.0.4.1 remote-as 64502
 neighbor 10.0.4.1 description transit
 neighbor 10.0.4.1 timers 3 9
 neighbor 10.0.3.1 remote-as 64500
 neighbor 10.0.3.1 description core
 neighbor 10.0.3.1 timers 3 9
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.0.4.1 route-map ACCEPT in
  neighbor 10.0.4.1 route-map OWN-ONLY out
  neighbor 10.0.3.1 route-map ACCEPT in
  neighbor 10.0.3.1 route-map OWN-ONLY out
 exit-address-family
exit
!
