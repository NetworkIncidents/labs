frr defaults traditional
hostname edge
!
interface lo
 ip address 192.0.2.1/25
!
interface eth1
 description to transit (our provider)
 ip address 10.0.1.2/30
!
interface eth2
 description to core (our backbone)
 ip address 10.0.2.1/30
!
ip prefix-list OURS seq 5 permit 192.0.2.0/25
ip prefix-list SITE-B seq 5 permit 192.0.2.128/25
ip prefix-list BACKBONE seq 5 permit 10.0.2.2/32
!
route-map TO-TRANSIT permit 10
 match ip address prefix-list OURS
exit
!
route-map TO-TRANSIT permit 20
 match ip address prefix-list SITE-B
 match ip next-hop prefix-list BACKBONE
exit
!
route-map FROM-TRANSIT permit 10
exit
!
bgp route-map delay-timer 1
!
router bgp 64500
 bgp router-id 192.0.2.1
 neighbor 10.0.1.1 remote-as 64502
 neighbor 10.0.1.1 description transit
 neighbor 10.0.1.1 timers 3 9
 neighbor 10.0.2.2 remote-as 64500
 neighbor 10.0.2.2 description core
 neighbor 10.0.2.2 timers 3 9
 !
 address-family ipv4 unicast
  network 192.0.2.0/25
  neighbor 10.0.1.1 route-map FROM-TRANSIT in
  neighbor 10.0.1.1 route-map TO-TRANSIT out
  neighbor 10.0.2.2 next-hop-self
 exit-address-family
exit
!
