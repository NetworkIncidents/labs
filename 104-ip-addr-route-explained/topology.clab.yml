# ip addr and ip route, explained: a Network Incidents lab. Start it with ./lab.sh up (see README.md).
name: iproute-basics
topology:
  nodes:
    pc:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip addr add 10.0.10.20/24 dev eth1
        - ip route replace default via 10.0.10.1 dev eth1
        - ip link set eth0 down
        - sh -c 'echo "10.0.20.80 web.homelab.test" >> /etc/hosts'
        # containerlab adds a random altname to each link; it would show in ip addr as an unexplained line
        - sh -c 'for i in eth1 eth2; do for a in $(ip -j link show $i 2>/dev/null | jq -r ".[0].altnames[]?"); do ip link property del dev $i altname $a; done; done'
    sw:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip link add br0 type bridge
        - sh -c 'for p in eth1 eth2 eth3; do ip link set $p master br0; done'
        - ip link set br0 up
        - ip link set eth0 down
    nas:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip addr add 10.0.10.30/24 dev eth1
        - ip route replace default via 10.0.10.1 dev eth1
        - ip link set eth0 down
    # the router between the two networks
    router:
      kind: linux
      image: nicolaka/netshoot:v0.16
      labels: {role: router}
      exec:
        - ip addr add 10.0.10.1/24 dev eth1
        - ip addr add 10.0.20.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - ip link set eth0 down
        # containerlab adds a random altname to each link; it would show in ip addr as an unexplained line
        - sh -c 'for i in eth1 eth2; do for a in $(ip -j link show $i 2>/dev/null | jq -r ".[0].altnames[]?"); do ip link property del dev $i altname $a; done; done'
    sw2:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip link add br0 type bridge
        - sh -c 'for p in eth1 eth2 eth3; do ip link set $p master br0; done'
        - ip link set br0 up
        - ip link set eth0 down
    web:
      kind: linux
      image: nicolaka/netshoot:v0.16
      exec:
        - ip addr add 10.0.20.80/24 dev eth1
        - ip route replace default via 10.0.20.1 dev eth1
        - ip link set eth0 down
    # serves its status page, but a firewall rule drops every ping
    printer:
      kind: linux
      image: nicolaka/netshoot:v0.16
      binds:
        - configs/printer/index.html:/srv/index.html
      exec:
        - ip addr add 10.0.20.40/24 dev eth1
        - ip route replace default via 10.0.20.1 dev eth1
        - ip link set eth0 down
        - iptables -A INPUT -p icmp --icmp-type echo-request -j DROP
        - sh -c 'cd /srv && nohup python3 -m http.server 80 >/dev/null 2>&1 &'
  # listed from the pc outward; containerlab defaults veths to 9500
  links:
    - endpoints: ["pc:eth1", "sw:eth1"]
      mtu: 1500
    - endpoints: ["sw:eth2", "nas:eth1"]
      mtu: 1500
    - endpoints: ["sw:eth3", "router:eth1"]
      mtu: 1500
    - endpoints: ["router:eth2", "sw2:eth1"]
      mtu: 1500
    - endpoints: ["sw2:eth2", "web:eth1"]
      mtu: 1500
    - endpoints: ["sw2:eth3", "printer:eth1"]
      mtu: 1500
